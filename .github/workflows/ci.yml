name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests are split across two machines and their coverage is judged
  # together in the last job:
  #   build-test      Windows: the build, and every test that needs no database.
  #   database-tests  Linux: the tests that need PostgreSQL. They start it in a
  #                   container, which a Windows runner cannot run.
  #   coverage        merges both halves' reports and enforces the floor.
  build-test:
    # WPF (net10.0-windows) needs a Windows runner for the Desktop + Desktop.Tests
    # projects. Don't downgrade to ubuntu-latest without first excluding those.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          # Honours global.json for the exact 10.0.x version; setup-dotnet
          # falls back to its installed SDK list if global.json's version
          # isn't yet published.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ShowroomBilling.sln

      - name: Audit NuGet packages
        shell: pwsh
        run: |
          $output = dotnet list ShowroomBilling.sln package --vulnerable --include-transitive | Out-String
          $output
          if ($LASTEXITCODE -ne 0 -or $output -match 'has the following vulnerable packages') { exit 1 }

      - name: Verify formatting
        run: dotnet format style ShowroomBilling.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ShowroomBilling.sln --configuration Release --no-restore -warnaserror

      - name: Test (everything that needs no database)
        shell: pwsh
        run: ./tools/Test-Coverage.ps1 -NoBuild -Tests WithoutDatabase -SkipThreshold

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: 'artifacts/coverage/**/*.trx'
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-without-database
          path: artifacts/coverage/**/coverage.cobertura*.xml
          if-no-files-found: error

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test (everything that needs PostgreSQL 18)
        shell: pwsh
        run: ./tools/Test-Coverage.ps1 -Tests DatabaseOnly -SkipThreshold

      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: database-test-results
          path: 'artifacts/coverage/**/*.trx'
          if-no-files-found: error

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-database
          path: artifacts/coverage/**/coverage.cobertura*.xml
          if-no-files-found: error

  coverage:
    needs: [build-test, database-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download coverage (without database)
        uses: actions/download-artifact@v7
        with:
          name: coverage-without-database
          path: artifacts/coverage/without-database

      - name: Download coverage (database)
        uses: actions/download-artifact@v7
        with:
          name: coverage-database
          path: artifacts/coverage/database

      - name: Enforce merged coverage
        shell: pwsh
        run: ./tools/Test-Coverage.ps1 -Tests None
